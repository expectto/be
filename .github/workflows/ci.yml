name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        run: |
          for m in . x/mock x/belint; do
            echo "== lint $m =="
            (cd "$m" && go tool standardgo ./...)
          done

      - name: Test
        run: |
          for m in . x/mock x/belint; do
            echo "== test $m =="
            (cd "$m" && go test ./...)
          done
